apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 2                      # always keep 2 pods running
  selector:
    matchLabels:
      app: demo-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # never drop below 2 ready pods during a deploy
      maxSurge: 1
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      # Prefer to put the 2 pods on different nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: demo-app
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER   # replaced by the workflow with user/demo-app:<commit-sha>
          ports:
            - containerPort: 80
          readinessProbe:            # traffic is sent only to pods that pass this
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:             # Kubernetes restarts the container if this keeps failing
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
