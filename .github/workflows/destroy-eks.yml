name: Destroy EKS Infrastructure

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  CLUSTER_NAME: demo-app-eks

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # IMPORTANT: the Service creates an AWS load balancer that Terraform does not know about.
      # If it is not deleted first, the VPC cannot be destroyed.
      - name: Delete Kubernetes resources (removes the load balancer)
        run: |
          if aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"; then
            kubectl delete -f eks/k8s/ --ignore-not-found --timeout=300s || true
          else
            echo "Cluster not found, skipping."
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform init
        working-directory: eks/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform destroy
        working-directory: eks/terraform
        run: terraform destroy -auto-approve -var="aws_region=${{ env.AWS_REGION }}" -var="cluster_name=${{ env.CLUSTER_NAME }}"
